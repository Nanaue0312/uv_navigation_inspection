authors = ["You <you@example.com>"]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
keywords = ["uv", "streamlit", "navigation", "analysis"]

dependencies = [
    "streamlit>=1.38",
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.20",
    "json5>=0.9"
]

