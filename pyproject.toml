[project]
name = "uv-navigation-inspection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=5.24.1",
    "seaborn>=0.13.2",
    "streamlit>=1.51.0",
]

[project.scripts]
uv_navigation_inspection = "run_app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

