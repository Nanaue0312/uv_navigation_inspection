[project]
name = "uv-navigation-inspection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.7.5",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "plotly>=6.5.2",
    "scipy>=1.10.1",
    "seaborn>=0.13.2",
    "streamlit>=1.40.1",
]


[project.scripts]
uv_navigation_inspection = "run_app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "build"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyinstaller>=6.17.0",
]

